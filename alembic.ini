# Alembic configuration for ОценитьКвартиру.рф backend
#
# DATABASE_URL must be set in the environment; it is intentionally absent here
# so credentials never land in version control.
#
# Typical usage (from workspace root):
#   DATABASE_URL=postgresql://... alembic upgrade head
#   DATABASE_URL=postgresql://... alembic autogenerate -m "describe change"
#   DATABASE_URL=postgresql://... alembic check
#
# Offline SQL rendering (no live DB needed):
#   alembic upgrade head --sql

[alembic]
script_location = alembic

# file_template controls revision filename format
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for revision filenames
timezone = UTC

prepend_sys_path = .

# sqlalchemy.url is intentionally omitted here.
# env.py reads DATABASE_URL from the OS environment and sets it at runtime.

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# Set to INFO to see SQL statements:
# level = INFO

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
